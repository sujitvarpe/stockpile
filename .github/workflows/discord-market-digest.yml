name: Discord market digest

# Two UTC crons per report so one of them is the right New York time
# whether or not DST is in effect; --cron-utc/--et-time drop the other.
# The check uses the scheduled time, not the clock, because GitHub often
# starts scheduled runs 1-2 hours late.
#   earnings: ~08:07 ET (pre-market)   sectors: ~16:17 ET (after the close)
on:
  schedule:
    - cron: "7 12 * * 1-5"
    - cron: "7 13 * * 1-5"
    - cron: "17 20 * * 1-5"
    - cron: "17 21 * * 1-5"
  workflow_dispatch:
    inputs:
      report:
        description: Which report to post
        type: choice
        options: [all, sectors, earnings]
        default: all

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          REPORT: ${{ inputs.report }}
        run: |
          case "$SCHEDULE" in
            "7 12 * * 1-5")
              uv run discord-alerts/market_digest.py earnings --cron-utc 12:07 --et-time 08:07 ;;
            "7 13 * * 1-5")
              uv run discord-alerts/market_digest.py earnings --cron-utc 13:07 --et-time 08:07 ;;
            "17 20 * * 1-5")
              uv run discord-alerts/market_digest.py sectors --cron-utc 20:17 --et-time 16:17 ;;
            "17 21 * * 1-5")
              uv run discord-alerts/market_digest.py sectors --cron-utc 21:17 --et-time 16:17 ;;
            *)
              uv run discord-alerts/market_digest.py "${REPORT:-all}" ;;
          esac

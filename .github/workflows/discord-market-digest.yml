name: Discord market digest

# Two UTC crons per report so one of them lands in the New York window
# whether or not DST is in effect; --et-window drops the other.
#   earnings: ~08:07 ET (pre-market)   sectors: ~16:17 ET (after the close)
on:
  schedule:
    - cron: "7 12 * * 1-5"
    - cron: "7 13 * * 1-5"
    - cron: "17 20 * * 1-5"
    - cron: "17 21 * * 1-5"
  workflow_dispatch:
    inputs:
      report:
        description: Which report to post
        type: choice
        options: [all, sectors, earnings]
        default: all

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          SCHEDULE: ${{ github.event.schedule }}
          REPORT: ${{ inputs.report }}
        run: |
          case "$SCHEDULE" in
            "7 12 * * 1-5"|"7 13 * * 1-5")
              uv run discord-alerts/market_digest.py earnings --et-window 08:00-09:00 ;;
            "17 20 * * 1-5"|"17 21 * * 1-5")
              uv run discord-alerts/market_digest.py sectors --et-window 16:10-17:10 ;;
            *)
              uv run discord-alerts/market_digest.py "${REPORT:-all}" ;;
          esac
